events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Upstream backend
    upstream audiobook_backend {
        server audiobook-api:8000;
    }

    # HTTP server
    server {
        listen 80;
        server_name _;

        # API routes
        location /api/ {
            proxy_pass http://audiobook_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for long requests (TTS, downloads)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Buffering for streaming audio
            proxy_buffering off;
            proxy_cache off;
        }

        # Static covers
        location /covers/ {
            alias /var/www/covers/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Audio file streaming
        location /audio/ {
            proxy_pass http://audiobook_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Range request support for audio seeking
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Health check
        location /health {
            proxy_pass http://audiobook_backend;
            access_log off;
        }

        # Default
        location / {
            proxy_pass http://audiobook_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}