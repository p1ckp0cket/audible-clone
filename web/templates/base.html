<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audible Clone - Home</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --dark-charcoal: #1A2523;
            --forest-green: #2E4A43;
            --deep-teal: #155D7A;
            --steel-blue: #5B9BB5;
            --icy-blue: #CDE6F0;
            --bg-primary: #1A1A2E;
            --bg-secondary: #16213E;
            --bg-card: #1F2A44;
            --accent: #5B9BB5;
            --accent-hover: #4A8AA3;
            --text-primary: #FFFFFF;
            --text-secondary: #A0B8D0;
            --text-muted: #6B8BA4;
            --border: #2A3A5E;
            --success: #2E4A43;
            --warning: #D4A537;
            --error: #C0392B;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }
        
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }
        
        /* Layout */
        .app-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .main-content {
            flex: 1;
            padding-bottom: 80px; /* Space for bottom nav on mobile */
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--deep-teal), var(--steel-blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .search-box {
            position: relative;
            width: 300px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 155, 181, 0.2);
        }
        
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .header-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .header-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .header-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        
        .header-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        /* Main Sections */
        .section {
            padding: 32px 0;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .section-link {
            color: var(--accent);
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .section-link:hover {
            color: var(--accent-hover);
        }
        
        /* Carousel */
        .carousel-container {
            position: relative;
        }
        
        .carousel {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 8px 0 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--bg-secondary);
        }
        
        .carousel::-webkit-scrollbar {
            height: 6px;
        }
        
        .carousel::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 3px;
        }
        
        .carousel::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
        
        .carousel-item {
            flex: 0 0 280px;
            scroll-snap-align: start;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .carousel-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }
        
        .book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: var(--bg-secondary);
        }
        
        .book-info {
            padding: 16px;
        }
        
        .book-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .book-author {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .book-meta {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .book-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Grid */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        
        .grid-book {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .grid-book:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }
        
        .grid-book .book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        
        .grid-book .book-info {
            padding: 14px;
        }
        
        .grid-book .book-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .grid-book .book-author {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        /* Bottom Navigation (Mobile) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s;
            min-width: 60px;
        }
        
        .nav-item.active {
            color: var(--accent);
        }
        
        .nav-item:hover,
        .nav-item.active:hover {
            color: var(--accent);
            background: var(--bg-card);
        }
        
        .nav-icon {
            font-size: 1.25rem;
        }
        
        .nav-label {
            font-size: 0.7rem;
            font-weight: 500;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--text-primary);
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }
        
        .btn-icon {
            padding: 10px;
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        
        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1);
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 155, 181, 0.2);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        /* Audio Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .player-track {
            flex: 1;
            min-width: 0;
        }
        
        .player-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .player-cover {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .player-title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .player-author {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .player-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        
        .progress-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 45px;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-btn:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        
        .control-btn.play-pause {
            background: var(--accent);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
        }
        
        .control-btn.play-pause:hover {
            background: var(--accent-hover);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .search-box {
                width: 180px;
            }
            
            .header-btn span {
                display: none;
            }
            
            .carousel-item {
                flex: 0 0 240px;
            }
            
            .grid-book {
                flex: 0 0 140px;
            }
        }
        
        @media (max-width: 480px) {
            .carousel-item {
                flex: 0 0 200px;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="/" class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                    <span>Audible Clone</span>
                </a>
                
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" placeholder="Search books, authors, narrators..." id="headerSearch">
                </div>
                
                <div class="header-actions">
                    <button class="header-btn" title="Notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                    <button class="header-btn" title="Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 1 4.6 9a1.65 1.65 0 0 0 .33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                    <button class="header-btn primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add</span>
                    </button>
                </div>
            </div>
        </header>
        
        <main class="main-content">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>
        
        <!-- Bottom Navigation (Mobile) -->
        <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
            <a href="/" class="nav-item active" aria-current="page">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="/library" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span class="nav-label">Library</span>
            </a>
            <a href="/discover" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span class="nav-label">Discover</span>
            </a>
            <a href="/profile" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="nav-label">Profile</span>
            </a>
        </nav>
        
        <!-- Audio Player Bar -->
        <div class="player-bar" id="playerBar" style="display: none;">
            <div class="player-track">
                <div class="player-track-info">
                    <img class="player-cover" src="" alt="" id="playerCover">
                    <div>
                        <div class="player-title" id="playerTitle">No book playing</div>
                        <div class="player-author" id="playerAuthor"></div>
                    </div>
                </div>
                <div class="player-progress">
                    <span class="progress-time" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <span class="progress-time" id="totalTime">0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="prevBtn" title="Previous">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </button>
                <button class="control-btn play-pause" id="playPauseBtn" title="Play/Pause">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="playIcon">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="pauseIcon" style="display:none;">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </button>
                <button class="control-btn" id="nextBtn" title="Next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- JavaScript -->
        <script>
            // Global state
            const state = {
                currentBook: null,
                isPlaying: false,
                currentTime: 0,
                duration: 0,
                playerVisible: false
            };
            
            // DOM elements
            const playerBar = document.getElementById('playerBar');
            const playerCover = document.getElementById('playerCover');
            const playerTitle = document.getElementById('playerTitle');
            const playerAuthor = document.getElementById('playerAuthor');
            const progressFill = document.getElementById('progressFill');
            const progressBar = document.getElementById('progressBar');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const progressBarEl = document.getElementById('progressBar');
            
            // Format time
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }
            
            // Update player UI
            function updatePlayerUI() {
                if (state.currentBook) {
                    playerBar.style.display = 'flex';
                    state.playerVisible = true;
                    
                    if (state.currentBook.cover_path) {
                        playerCover.src = '/covers/' + state.currentBook.cover_path.split('/').pop();
                    } else {
                        playerCover.src = 'https://via.placeholder.com/56x84/3a3a3a/ffffff?text=No+Cover';
                    }
                    playerTitle.textContent = state.currentBook.title || 'Unknown';
                    playerAuthor.textContent = state.currentBook.author || '';
                    totalTimeEl.textContent = formatTime(state.duration);
                    currentTimeEl.textContent = formatTime(state.currentTime);
                    
                    const progress = state.duration > 0 ? (state.currentTime / state.duration) * 100 : 0;
                    progressFill.style.width = progress + '%';
                    
                    if (state.isPlaying) {
                        playIcon.style.display = 'none';
                        pauseIcon.style.display = 'block';
                    } else {
                        playIcon.style.display = 'block';
                        pauseIcon.style.display = 'none';
                    }
                } else {
                    playerBar.style.display = 'none';
                    state.playerVisible = false;
                }
            }
            
            // Toggle play/pause
            playPauseBtn.addEventListener('click', async () => {
                if (state.isPlaying) {
                    // Pause
                    state.isPlaying = false;
                    updatePlayerUI();
                } else {
                    // Play
                    state.isPlaying = true;
                    updatePlayerUI();
                }
            });
            
            // Progress bar click
            progressBarEl.addEventListener('click', (e) => {
                const rect = progressBarEl.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                state.currentTime = percent * state.duration;
                updatePlayerUI();
            });
            
            // Initialize
            document.addEventListener('DOMContentLoaded', () => {
                updatePlayerUI();
                
                // Simulate progress for demo
                setInterval(() => {
                    if (state.isPlaying && state.duration > 0) {
                        state.currentTime += 1;
                        if (state.currentTime >= state.duration) {
                            state.currentTime = 0;
                        }
                        updatePlayerUI();
                    }
                }, 1000);
            });
        </script>
        {% block scripts %}{% endblock %}
</body>
</html>
