version: '3.8'

services:
  # Backend API
  audiobook-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audiobook-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////data/library.db
      - AUDIOBOOKS_PATH=/mnt/drive2/audiobooks
      - EBOOKS_UPLOAD_PATH=/mnt/drive2/ebooks
      - COVERS_PATH=/mnt/drive2/covers
      - TTS_OUTPUT_PATH=/mnt/drive2/tts_output
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-admin}
      - QBITTORRENT_CATEGORY=audiobooks
      - QBITTORRENT_SAVE_PATH=/mnt/drive2/audiobooks
      - ABB_HOSTNAME=audiobookbay.is
      - TTS_ENGINE=auto
      - PIPER_MODEL_DIR=/home/paperclip/piper/models
      - KOKORO_MODEL_PATH=/home/paperclip/kokoro/kokoro-v1.0.onnx
    volumes:
      - audiobook-data:/data
      - /mnt/drive2/audiobooks:/mnt/drive2/audiobooks
      - /mnt/drive2/ebooks:/mnt/drive2/ebooks
      - /mnt/drive2/covers:/mnt/drive2/covers
      - /mnt/drive2/tts_output:/mnt/drive2/tts_output
      - /home/paperclip/piper/models:/home/paperclip/piper/models
      - /home/paperclip/kokoro:/home/paperclip/kokoro
    depends_on:
      qbittorrent:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - audiobook-network

  # Web Interface
  audiobook-web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    container_name: audiobook-web
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://audiobook-api:8000
    volumes:
      - audiobook-web-data:/data
      - /mnt/drive2/covers:/mnt/drive2/covers
      - /mnt/drive2/ebooks:/mnt/drive2/ebooks
      - /mnt/drive2/tts_output:/mnt/drive2/tts_output
    depends_on:
      audiobook-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiobook-network

  # qBittorrent for AudioBookBay downloads
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - WEBUI_PORT=8080
      - QBITTORRENT_WEBUI_USERNAME=admin
      - QBITTORRENT_WEBUI_PASSWORD=${QBITTORRENT_PASSWORD:-admin}
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/drive2/audiobooks:/downloads
    restart: unless-stopped
    networks:
      - audiobook-network

  # Nginx reverse proxy - use host networking to access localhost:8000
  nginx:
    image: nginx:alpine
    container_name: audiobook-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /mnt/drive2/covers:/var/www/covers:ro
    network_mode: "host"
    restart: unless-stopped

  # Certbot for SSL (can be removed for HTTP-only)
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  # Watchtower for auto-updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    restart: unless-stopped

networks:
  audiobook-network:
    driver: bridge

volumes:
  audiobook-data:
    driver: local
  audiobook-web-data:
    driver: local